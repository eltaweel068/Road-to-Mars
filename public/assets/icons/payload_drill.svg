<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Nuclear Deep Subsurface Drill Rig -->
  <defs>
    <linearGradient id="drillMetal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="nukeCore" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#38fedc"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="bitGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>
  <!-- Gantry Tripod Tower Structure -->
  <line x1="20" y1="78" x2="42" y2="28" stroke="#000" stroke-width="3"/>
  <line x1="80" y1="78" x2="58" y2="28" stroke="#000" stroke-width="3"/>
  <line x1="26" y1="62" x2="74" y2="62" stroke="#000" stroke-width="2.5"/>
  <line x1="33" y1="46" x2="67" y2="46" stroke="#000" stroke-width="2"/>

  <!-- Radiation Shield / Kilopower Nuclear Reactor Top Dome -->
  <path d="M38,28 C38,16 44,10 50,10 C56,10 62,16 62,28 Z" fill="url(#nukeCore)" stroke="#000" stroke-width="2.5"/>
  <!-- Radiation Warning Icon on Reactor -->
  <circle cx="50" cy="20" r="3" fill="#000"/>
  <circle cx="50" cy="20" r="1.2" fill="#38fedc"/>

  <!-- Hydraulic Drill Motor Housing -->
  <rect x="42" y="28" width="16" height="24" rx="2" fill="url(#drillMetal)" stroke="#000" stroke-width="2.5"/>
  <rect x="45" y="32" width="10" height="4" fill="#f5f557" stroke="#000" stroke-width="1"/>
  <rect x="45" y="40" width="10" height="4" fill="#f5f557" stroke="#000" stroke-width="1"/>

  <!-- Rotating Core Shaft (Tungsten Carbide) -->
  <rect x="47" y="52" width="6" height="26" fill="url(#drillMetal)" stroke="#000" stroke-width="2"/>
  <!-- Helical Drill Flutes -->
  <line x1="47" y1="56" x2="53" y2="60" stroke="#000" stroke-width="2"/>
  <line x1="47" y1="64" x2="53" y2="68" stroke="#000" stroke-width="2"/>
  <line x1="47" y1="72" x2="53" y2="76" stroke="#000" stroke-width="2"/>

  <!-- Subsurface Diamond Drill Bit Head -->
  <polygon points="45,78 55,78 50,94" fill="url(#bitGlow)" stroke="#000" stroke-width="2"/>

  <!-- Ground Crust Surface & Subsurface Rock Fractures -->
  <line x1="10" y1="82" x2="44" y2="82" stroke="#78350f" stroke-width="4"/>
  <line x1="56" y1="82" x2="90" y2="82" stroke="#78350f" stroke-width="4"/>
  <polygon points="40,86 46,92 50,88 54,92 60,86" fill="none" stroke="#ef4444" stroke-width="1.5"/>
</svg>