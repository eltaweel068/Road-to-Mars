<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Rocket Lab Electron -->
  <defs>
    <linearGradient id="elecBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="45%" stop-color="#2a2c30"/>
      <stop offset="100%" stop-color="#0d0d0f"/>
    </linearGradient>
    <linearGradient id="elecFairing" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="elecFlame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38fedc"/>
      <stop offset="40%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
  </defs>
  <!-- Exhaust Plume -->
  <polygon points="46,84 54,84 52,98 50,100 48,98" fill="url(#elecFlame)"/>
  <!-- Engine Nozzle -->
  <polygon points="45,80 55,80 54,84 46,84" fill="#475569" stroke="#000" stroke-width="1.5"/>
  <!-- First Stage Body -->
  <rect x="44" y="32" width="12" height="48" rx="1" fill="url(#elecBody)" stroke="#000" stroke-width="2"/>
  <!-- Silver Interstage Ring -->
  <rect x="44" y="29" width="12" height="3" fill="#cbd5e1" stroke="#000" stroke-width="1"/>
  <!-- Second Stage -->
  <rect x="44.5" y="19" width="11" height="10" fill="url(#elecBody)" stroke="#000" stroke-width="1.5"/>
  <!-- Fairing Cone -->
  <path d="M44.5,19 C44.5,12 47,4 50,4 C53,4 55.5,12 55.5,19 Z" fill="url(#elecFairing)" stroke="#000" stroke-width="2"/>
  <!-- Grid / Fin Details -->
  <polygon points="44,78 40,82 44,82" fill="#0f172a" stroke="#000" stroke-width="1.5"/>
  <polygon points="56,78 60,82 56,82" fill="#0f172a" stroke="#000" stroke-width="1.5"/>
  <!-- Rocket Lab Logo Stripe -->
  <rect x="48.5" y="40" width="3" height="16" fill="#e2e8f0"/>
  <circle cx="50" cy="11" r="1.5" fill="#38fedc"/>
</svg>