<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- NASA SLS Block 1B -->
  <defs>
    <linearGradient id="slsOrange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="45%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="srbWhite" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="slsFlame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
  </defs>
  <!-- Exhaust Plumes (Core & Dual SRBs) -->
  <polygon points="43,85 57,85 50,101" fill="url(#slsFlame)"/>
  <polygon points="29,86 37,86 33,98" fill="url(#slsFlame)"/>
  <polygon points="63,86 71,86 67,98" fill="url(#slsFlame)"/>

  <!-- Solid Rocket Booster Left -->
  <polygon points="29,82 37,82 36,86 30,86" fill="#334155" stroke="#000" stroke-width="1"/>
  <rect x="29" y="32" width="8" height="50" rx="1" fill="url(#srbWhite)" stroke="#000" stroke-width="2"/>
  <polygon points="29,32 37,32 33,21" fill="url(#srbWhite)" stroke="#000" stroke-width="2"/>
  <rect x="29" y="44" width="8" height="2" fill="#0f172a"/>
  <rect x="29" y="58" width="8" height="2" fill="#0f172a"/>

  <!-- Solid Rocket Booster Right -->
  <polygon points="63,82 71,82 70,86 64,86" fill="#334155" stroke="#000" stroke-width="1"/>
  <rect x="63" y="32" width="8" height="50" rx="1" fill="url(#srbWhite)" stroke="#000" stroke-width="2"/>
  <polygon points="63,32 71,32 67,21" fill="url(#srbWhite)" stroke="#000" stroke-width="2"/>
  <rect x="63" y="44" width="8" height="2" fill="#0f172a"/>
  <rect x="63" y="58" width="8" height="2" fill="#0f172a"/>

  <!-- Core Stage Engine Section (4x RS-25) -->
  <polygon points="41,80 59,80 58,85 42,85" fill="#334155" stroke="#000" stroke-width="1.5"/>
  <!-- Giant Orange Core Stage (Cryogenic Tank) -->
  <rect x="40" y="27" width="20" height="53" rx="2" fill="url(#slsOrange)" stroke="#000" stroke-width="2.5"/>
  <!-- NASA Worm Logo Stripe -->
  <path d="M44,48 L56,48 M44,52 L56,52" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

  <!-- Exploration Upper Stage (EUS) -->
  <rect x="42" y="17" width="16" height="10" fill="url(#srbWhite)" stroke="#000" stroke-width="2"/>

  <!-- Orion Crew Capsule & Launch Abort System (LAS) -->
  <polygon points="42,17 58,17 50,6" fill="url(#srbWhite)" stroke="#000" stroke-width="2"/>
  <!-- LAS Tower Spike -->
  <line x1="50" y1="6" x2="50" y2="1" stroke="#000" stroke-width="2"/>
</svg>