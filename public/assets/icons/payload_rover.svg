<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Mars Rover Lab (Curiosity / Perseverance) -->
  <defs>
    <linearGradient id="chassisGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="wheelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <!-- MastCam Mast & Camera Head -->
  <line x1="38" y1="46" x2="38" y2="18" stroke="#000" stroke-width="3"/>
  <rect x="32" y="10" width="16" height="10" rx="2" fill="#334155" stroke="#000" stroke-width="2"/>
  <circle cx="36" cy="15" r="2.5" fill="#38fedc"/>
  <circle cx="44" cy="15" r="2.5" fill="#38fedc"/>

  <!-- Robotic Arm (Front) -->
  <polyline points="28,52 14,46 12,62 18,65" fill="none" stroke="#000" stroke-width="2.5"/>
  <circle cx="18" cy="65" r="3" fill="#ef4444" stroke="#000" stroke-width="1.5"/>

  <!-- RTG Nuclear Power Generator (Rear) -->
  <rect x="68" y="38" width="16" height="12" rx="2" fill="#0284c7" stroke="#000" stroke-width="2"/>
  <line x1="72" y1="38" x2="72" y2="50" stroke="#000" stroke-width="1.5"/>
  <line x1="76" y1="38" x2="76" y2="50" stroke="#000" stroke-width="1.5"/>
  <line x1="80" y1="38" x2="80" y2="50" stroke="#000" stroke-width="1.5"/>

  <!-- Rover Main Chassis Body -->
  <polygon points="26,46 72,46 68,64 28,64" fill="url(#chassisGrad)" stroke="#000" stroke-width="3"/>
  <!-- High Gain Antenna -->
  <ellipse cx="54" cy="42" rx="6" ry="3" fill="#cbd5e1" stroke="#000" stroke-width="1.5"/>

  <!-- Rocker-Bogie Suspension Legs -->
  <polyline points="28,60 22,76" stroke="#000" stroke-width="3"/>
  <polyline points="48,60 50,76" stroke="#000" stroke-width="3"/>
  <polyline points="66,60 76,76" stroke="#000" stroke-width="3"/>

  <!-- 6 Aluminum Cleated Wheels -->
  <!-- Wheel 1 -->
  <circle cx="20" cy="78" r="9" fill="url(#wheelGrad)" stroke="#000" stroke-width="2.5"/>
  <circle cx="20" cy="78" r="3" fill="#cbd5e1"/>
  <!-- Wheel 2 -->
  <circle cx="50" cy="78" r="9" fill="url(#wheelGrad)" stroke="#000" stroke-width="2.5"/>
  <circle cx="50" cy="78" r="3" fill="#cbd5e1"/>
  <!-- Wheel 3 -->
  <circle cx="80" cy="78" r="9" fill="url(#wheelGrad)" stroke="#000" stroke-width="2.5"/>
  <circle cx="80" cy="78" r="3" fill="#cbd5e1"/>

  <!-- Wheel Cleat Details -->
  <line x1="20" y1="69" x2="20" y2="72" stroke="#94a3b8" stroke-width="2"/>
  <line x1="50" y1="69" x2="50" y2="72" stroke="#94a3b8" stroke-width="2"/>
  <line x1="80" y1="69" x2="80" y2="72" stroke="#94a3b8" stroke-width="2"/>
</svg>